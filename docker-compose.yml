version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: atmosync-postgres
    environment:
      POSTGRES_DB: atmosync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: atmosync-app
    ports:
      - "8080:8080"
    depends_on:
      - postgres